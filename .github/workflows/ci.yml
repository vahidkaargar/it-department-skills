name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          python3 -m py_compile $(git ls-files '*.py')
          python3 -c "import ast; ast.parse(open('discovery/skills-catalog/scripts/skillfind').read())"

      - name: Python lint (ruff)
        run: |
          pip install --quiet ruff==0.16.1
          ruff check .

      - name: Skill security scorer tests
        run: python3 skills/skill-tester/tests/test_security_scorer.py

      - name: Skill security auditor tests
        run: python3 skills/skill-security-auditor/tests/test_scan_file_prompt_injection.py

      - name: Skills-catalog tests (build-index.py, skillfind)
        run: |
          python3 discovery/skills-catalog/tests/test_build_index.py
          python3 discovery/skills-catalog/tests/test_skillfind.py

      - name: Duplicate code check (jscpd)
        run: npx --yes jscpd@5.0.14 --config .jscpd.json .

      - name: Installer smoke test (fresh HOME, no symlinks)
        run: |
          FAKE_HOME=$(mktemp -d)
          python3 install.py --yes --home "$FAKE_HOME"
          test "$(find "$FAKE_HOME" -type l | wc -l)" -eq 0
          HOME="$FAKE_HOME" "$FAKE_HOME/.local/bin/skillfind" "redact secrets" | grep -q pii-scrub
          python3 install.py --yes --home "$FAKE_HOME" | grep -q "already up to date"

      - name: Secret / PII scan
        run: |
          ! git grep -nE '(BEGIN (RSA|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,})' -- . \
            ':!skills/skill-tester/tests' ':!skills/skill-security-auditor' ':!skills/pii-scrub'

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Installer smoke test (Windows, fresh home)
        shell: bash
        run: |
          FAKE_HOME="$RUNNER_TEMP/fake-home"
          mkdir -p "$FAKE_HOME"
          python install.py --yes --home "$FAKE_HOME"
          test "$(find "$FAKE_HOME" -type l | wc -l)" -eq 0
          HOME="$FAKE_HOME" USERPROFILE="$FAKE_HOME" python "$FAKE_HOME/.local/bin/skillfind" "redact secrets" | grep -q pii-scrub
          python install.py --yes --home "$FAKE_HOME" | grep -q "already up to date"
